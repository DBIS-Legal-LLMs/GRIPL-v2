# Optional overlay: a real Let's Encrypt wildcard certificate via the DNS-01
# challenge, for when the project has a domain of its own.
#
#   docker compose -f compose.yaml -f repo/deploy/traefik/docker-compose.https.yml up -d
#
# Without a domain the default self-signed certificate is used and this file is
# not needed.
#
# Requirements (see deploy/README.md, section "A real certificate later"):
#   * BASE_DOMAIN, ACME_EMAIL and the RFC2136_* values in .env
#   * a DNS server that accepts RFC2136 updates for _acme-challenge.<BASE_DOMAIN>
#     (or another lego DNS provider: change ACME_DNS_PROVIDER and the env vars)
#
# Starts against the Let's Encrypt STAGING CA (untrusted certificates, but no
# rate limits) — set ACME_CA_SERVER to the production URL once it works.
services:
  traefik:
    command:
      # --- the flags of the base file (a compose override replaces the whole list) ---
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.watch=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=0s
      - --entrypoints.web.transport.respondingtimeouts.idletimeout=1800s
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=1800s
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --api.dashboard=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      # --- Let's Encrypt ---
      # one wildcard certificate for the whole base domain, used by all routers
      - --entrypoints.websecure.http.tls.certresolver=dns
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN}
      - --certificatesresolvers.dns.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.dns.acme.storage=/acme/acme.json
      - --certificatesresolvers.dns.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.dns.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-rfc2136}
