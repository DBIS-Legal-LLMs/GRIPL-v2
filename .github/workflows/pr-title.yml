# Release versions are computed from commit messages, so a pull request title has to be a
# conventional commit (feat: ..., fix: ..., chore: ..., docs: ..., feat!: ... for a breaking
# change). Squash merging uses the title as the commit message.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
