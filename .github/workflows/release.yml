# Automatic versioning with release-please (conventional commits).
#
#   fix: -> patch,  feat: -> minor,  feat!: or a "BREAKING CHANGE:" footer -> major
#
# Every push to dev updates one open "release PR" (new version + CHANGELOG.md). Merging that PR
# creates the git tag vX.Y.Z and the GitHub Release. Tags made with the default GITHUB_TOKEN do not
# start other workflows, so the CI run for the tag is started explicitly below; CI then publishes
# the images as :X.Y.Z and :X.Y (see ci.yml).
#
# The first release is 1.0.0 (`release-as` in release-please-config.json). Remove that line right
# after 1.0.0 is out, otherwise every later release is pinned to 1.0.0 as well.
# Only commits after `bootstrap-sha` count.
name: Release

on:
  push:
    branches: [dev]

permissions:
  contents: write        # tag, GitHub Release, release branch
  pull-requests: write   # the release PR
  actions: write         # start CI for the new tag

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
      - name: Build and publish the tagged images
        if: ${{ steps.rp.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.rp.outputs.tag_name }}"
