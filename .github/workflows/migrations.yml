# Guard for the database migrations of the GRIPL backend, see .github/scripts/check-migrations.sh:
# a pull request fails when it edits an existing migration or adds one that is not newer than the
# newest on the target branch, and gets a warning for statements that can lose data.
# Only runs when a migration or the script itself is touched.
#
# Third-party actions are pinned to a commit (the comment names the release).
name: Migrations

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "gripl/gripl-backend/src/main/resources/db/migration/**"
      - ".github/scripts/check-migrations.sh"
      - ".github/workflows/migrations.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the base branch and the merge base
      - name: Check migrations
        run: .github/scripts/check-migrations.sh "origin/${{ github.base_ref }}"
